name: deploy-prod
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '配備するタグ（例 v1.1.0）'
        required: true
        type: string
      confirmation:
        description: '本番に配備することを確認した'
        type: boolean
        default: false
jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: ① 確認チェック
        run: |
          [ "${{ inputs.confirmation }}" = "true" ] || { echo "::error::確認チェックが必要です"; exit 1; }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ② タグが存在するか
        run: |
          git rev-parse -q --verify "refs/tags/${TAG}^{commit}" >/dev/null \
            || { echo "::error::タグ ${TAG} がありません"; exit 1; }
      - name: ③ qa の最新の成功 deployment と同じ sha か
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          qa_sha=""
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=qa&per_page=10" --jq '.[].id'); do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses?per_page=1" --jq '.[0].state')
            if [ "$state" = "success" ]; then
              qa_sha=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}" --jq .sha); break
            fi
          done
          tag_sha=$(git rev-list -n1 "refs/tags/${TAG}")
          echo "qa=${qa_sha} tag=${tag_sha}"
          [ -n "$qa_sha" ] && [ "$qa_sha" = "$tag_sha" ] \
            || { echo "::error::${TAG} は qa に配備した版と違います"; exit 1; }
  deploy:
    needs: guard
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - run: echo "deploy ${{ inputs.tag }} to prod"

  backport:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}   # GITHUB_TOKEN だと PR の ci が承認待ちになる
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - name: hotfix の fix を main へ戻す PR を作る
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag_sha=$(git rev-list -n1 "refs/tags/${TAG}")
          if git merge-base --is-ancestor "$tag_sha" origin/main; then
            echo "${TAG} は main に含まれている（通常リリース）。backport は不要"; exit 0
          fi
          base=$(git merge-base "$tag_sha" origin/main)
          # hotfix ブランチ上の fix だけを拾う（release-please の release コミットは除く）
          picks=$(git rev-list --reverse "${base}..${tag_sha}" --grep='^chore(.*): release' --invert-grep)
          [ -n "$picks" ] || { echo "拾うコミットが無い"; exit 0; }
          git switch -c "backport/${TAG}" origin/main
          conflicted=""
          for c in $picks; do
            if ! git cherry-pick "$c"; then
              conflicted="${conflicted} $(git diff --name-only --diff-filter=U | tr '\n' ' ')"
              git add -A
              GIT_EDITOR=true git cherry-pick --continue   # 衝突マーカー入りのままコミットし、PR 上で解決してもらう
            fi
          done
          git push -u origin "backport/${TAG}"
          if [ -n "$conflicted" ]; then
            gh pr create --draft --base main --head "backport/${TAG}" \
              --title "fix: ${TAG} の hotfix を main に反映（要コンフリクト解決）" \
              --body "deploy-prod で ${TAG} を本番に配備しました。cherry-pick が衝突したので、次のファイルの衝突マーカーを手で解決してから Draft を外してください:${conflicted}"
          else
            gh pr create --base main --head "backport/${TAG}" \
              --title "fix: ${TAG} の hotfix を main に反映" \
              --body "deploy-prod で ${TAG} を本番に配備したので、hotfix の修正を main に戻します。"
          fi
